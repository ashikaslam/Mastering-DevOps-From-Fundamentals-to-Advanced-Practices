# =============================================================================
# Nginx Virtual Host for Django + Gunicorn
# Install path: /etc/nginx/sites-available/django
#
# Enable with:
#   sudo ln -s /etc/nginx/sites-available/django /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream django_app {
    server unix:/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name <YOUR_DOMAIN_OR_EC2_IP>;   # Replace with your domain or EC2 public IP

    # Redirect HTTP → HTTPS (uncomment after setting up SSL with Certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    # Static files served directly by Nginx
    location /static/ {
        alias /home/ubuntu/aws-django-cicd-monitoring/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /home/ubuntu/aws-django-cicd-monitoring/mediafiles/;
    }

    # Proxy all other requests to Gunicorn
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90s;
    }

    # Health check endpoint — no logging
    location /api/health/ {
        proxy_pass http://django_app;
        access_log off;
    }
}

