# =============================================================================
# Prometheus Alerting Rules
# Path on EC2: /etc/prometheus/alert_rules.yml
# =============================================================================

groups:
  - name: instance_alerts
    rules:

      # -----------------------------------------------------------------------
      # Instance Down
      # -----------------------------------------------------------------------
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is DOWN"
          description: >
            The target {{ $labels.instance }} (job: {{ $labels.job }})
            has been unreachable for more than 1 minute.

      # -----------------------------------------------------------------------
      # High CPU Usage (> 80% for 5 minutes)
      # -----------------------------------------------------------------------
      - alert: HighCPUUsage
        expr: >
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: >
            CPU usage on {{ $labels.instance }} has exceeded 80%
            for more than 5 minutes. Current value: {{ $value | printf "%.2f" }}%.

      # -----------------------------------------------------------------------
      # High Memory Usage (> 85%)
      # -----------------------------------------------------------------------
      - alert: HighMemoryUsage
        expr: >
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: >
            Memory usage on {{ $labels.instance }} has exceeded 85%
            for more than 5 minutes. Current value: {{ $value | printf "%.2f" }}%.

      # -----------------------------------------------------------------------
      # Low Disk Space (< 15% free)
      # -----------------------------------------------------------------------
      - alert: LowDiskSpace
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: >
            Disk space on {{ $labels.instance }} (/) is below 15%.
            Available: {{ $value | printf "%.2f" }}%.
