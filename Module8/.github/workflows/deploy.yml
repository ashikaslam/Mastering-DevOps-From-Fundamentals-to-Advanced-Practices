name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run tests before deploying
  # ─────────────────────────────────────────────
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          python manage.py test --verbosity=2

  # ─────────────────────────────────────────────
  # Job 2: Deploy to EC2 (only after tests pass)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy application via SSH
        run: |
          ssh -i ~/.ssh/deploy_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            echo "==> Navigating to application directory"
            cd /home/ubuntu/app || { mkdir -p /home/ubuntu/app && cd /home/ubuntu/app; }

            echo "==> Pulling latest code"
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone ${{ secrets.REPO_URL }} .
            fi

            echo "==> Installing Python dependencies"
            pip install -r requirements.txt --quiet

            echo "==> Running database migrations"
            python manage.py migrate --no-input

            echo "==> Collecting static files"
            python manage.py collectstatic --no-input

            echo "==> Restarting application service"
            sudo systemctl restart django-app || \
              (pkill gunicorn; gunicorn core.wsgi:application --bind 0.0.0.0:3000 --daemon --workers 3)

            echo "==> Deployment complete"
          ENDSSH

      - name: Verify deployment
        run: |
          sleep 10
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://${{ secrets.EC2_HOST }}:3000)
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Deployment verified — HTTP $HTTP_STATUS"
          else
            echo "❌ Deployment verification failed — HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed. Check the logs above for details."
          # Plug in a Slack/email webhook here if needed:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"🚨 Deployment to EC2 failed!"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
