server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml   # Tracks read positions across restarts

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  # ── System auth logs ────────────────────────────────────────────────────────
  - job_name: "system_auth"
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          host: module8-server
          __path__: /var/log/auth.log

  # ── Syslog ──────────────────────────────────────────────────────────────────
  - job_name: "syslog"
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: module8-server
          __path__: /var/log/syslog

  # ── Django application logs ──────────────────────────────────────────────────
  - job_name: "django_app"
    static_configs:
      - targets:
          - localhost
        labels:
          job: django
          host: module8-server
          __path__: /home/ubuntu/app/logs/*.log
    pipeline_stages:
      # Parse JSON log lines emitted by python-json-logger
      - json:
          expressions:
            level: levelname
            logger: name
            message: message
      - labels:
          level:
          logger:
