global:
  scrape_interval: 15s       # How often Prometheus scrapes targets
  evaluation_interval: 15s   # How often rules are evaluated

# Alertmanager configuration (optional — add your alertmanager host here)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']

scrape_configs:
  # ── Prometheus self-monitoring ──────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Node Exporter (host-level metrics: CPU, RAM, disk, network) ─────────────
  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"]

  # ── Django application metrics (via django-prometheus) ──────────────────────
  - job_name: "django_app"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:3000"]
