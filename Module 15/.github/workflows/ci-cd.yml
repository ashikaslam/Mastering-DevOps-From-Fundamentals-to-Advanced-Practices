name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Jest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  trivy-scan:
    name: Scan Docker image with Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'your-dockerhub-username/module-15-app:1.0.0'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

  conftest-opa:
    name: Check Kubernetes policy with Conftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Conftest OPA policy check
        uses: open-policy-agent/conftest-action@v1
        with:
          files: k8s/deployment.yaml
          policy: policies