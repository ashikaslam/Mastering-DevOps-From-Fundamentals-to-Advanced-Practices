# =============================================================================
# CI/CD Pipeline — prod environment
# Trigger : automated — fires when a PR is opened (or re-opened / synchronized)
#           targeting the `prod` branch.
# Actions : lint → build prod images → push to registry → deploy to k8s/prod
# Deployment is gated behind a GitHub Environment "prod" that can require
# manual approval reviewers before the deploy job runs.
# =============================================================================
name: CI/CD — Prod

on:
  pull_request:
    branches:
      - prod
    types:
      - opened
      - reopened
      - synchronize

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/supportchat
  K8S_NAMESPACE: prod

jobs:
  # ── 1. Lint & type-check ────────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & lint backend
        working-directory: backend
        run: |
          npm ci
          npm run typecheck

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install & lint frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn lint

  # ── 2. Build & push Docker images (prod Dockerfiles) ───────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag vars
        id: vars
        # For PRs, use the HEAD SHA of the source branch
        run: echo "sha_short=$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.prod.Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.PROD_API_URL }}
            VITE_SOCKET_URL=${{ secrets.PROD_SOCKET_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:prod-${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.prod.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:prod-${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to k8s/prod ──────────────────────────────────────────────────
  # This job is gated behind the "prod" GitHub Environment.
  # Add required reviewers in: Settings → Environments → prod → Protection rules
  deploy:
    name: Deploy → prod
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_PROD }}

      - name: Substitute image SHA in manifests
        env:
          SHA: ${{ needs.build-and-push.outputs.sha_short }}
        run: |
          sed -i "s|supportchat-frontend:prod-<SHA>|${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:prod-${SHA}|g" k8s/prod/frontend-deployment.yaml
          sed -i "s|supportchat-backend:prod-<SHA>|${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:prod-${SHA}|g"   k8s/prod/backend-deployment.yaml

      - name: Ensure namespace exists
        run: kubectl get namespace ${{ env.K8S_NAMESPACE }} || kubectl create namespace ${{ env.K8S_NAMESPACE }}

      - name: Apply manifests
        run: kubectl apply -f k8s/prod/ --namespace=${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout (zero-downtime)
        run: |
          kubectl rollout status deployment/frontend --namespace=${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/backend  --namespace=${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful."
          echo "   Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:prod-${{ needs.build-and-push.outputs.sha_short }}"
          echo "   Backend:  ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:prod-${{ needs.build-and-push.outputs.sha_short }}"
