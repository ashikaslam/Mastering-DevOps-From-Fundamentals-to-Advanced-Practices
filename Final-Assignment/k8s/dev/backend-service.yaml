apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: dev
  labels:
    app: backend
    env: dev
spec:
  type: NodePort
  selector:
    app: backend
    env: dev
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500   # access via <NodeIP>:30500 during dev
