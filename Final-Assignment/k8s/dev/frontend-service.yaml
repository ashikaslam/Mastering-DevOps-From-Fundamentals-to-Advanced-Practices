apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: dev
  labels:
    app: frontend
    env: dev
spec:
  type: NodePort
  selector:
    app: frontend
    env: dev
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080   # access via <NodeIP>:30080 during dev
