apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stage
  labels:
    app: backend
    env: stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      env: stage
  template:
    metadata:
      labels:
        app: backend
        env: stage
    spec:
      containers:
        - name: backend
          image: supportchat-backend:stage-<SHA>   # replaced by CI pipeline
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "staging"
            - name: PORT
              value: "5000"
            - name: CLIENT_URL
              value: "http://frontend-svc:80"
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
