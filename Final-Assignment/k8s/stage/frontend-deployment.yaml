apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stage
  labels:
    app: frontend
    env: stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      env: stage
  template:
    metadata:
      labels:
        app: frontend
        env: stage
    spec:
      containers:
        - name: frontend
          image: supportchat-frontend:stage-<SHA>   # replaced by CI pipeline
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: "http://backend-svc:5000"
            - name: VITE_SOCKET_URL
              value: "http://backend-svc:5000"
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
