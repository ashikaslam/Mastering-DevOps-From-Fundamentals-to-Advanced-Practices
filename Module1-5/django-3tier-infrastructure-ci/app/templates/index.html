<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ project_name }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem 3rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .badge {
      display: inline-block;
      background: #388bfd26;
      color: #58a6ff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      border: 1px solid #388bfd55;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f0f6fc;
      margin-bottom: 2rem;
      line-height: 1.3;
    }

    .info-grid {
      display: grid;
      gap: 1rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
    }

    .info-row .label {
      font-size: 0.8rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .info-row .value {
      font-size: 0.95rem;
      color: #e6edf3;
      font-weight: 500;
    }

    .status-active  { color: #3fb950; }
    .status-passing { color: #3fb950; }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">GitHub Actions · Module 5</span>
    <h1>{{ project_name }}</h1>

    <div class="info-grid">
      <div class="info-row">
        <span class="label">Project</span>
        <span class="value">{{ project_name }}</span>
      </div>
      <div class="info-row">
        <span class="label">Developer Status</span>
        <span class="value status-active">{{ developer_status }}</span>
      </div>
      <div class="info-row">
        <span class="label">Server Time</span>
        <span class="value">{{ current_time }}</span>
      </div>
      <div class="info-row">
        <span class="label">Pipeline Status</span>
        <span class="value status-passing">{{ pipeline_status }}</span>
      </div>
    </div>

    <footer>Self-Hosted Runner · Django {{ django_version|default:"4.2" }} · SQLite</footer>
  </div>
</body>
</html>
